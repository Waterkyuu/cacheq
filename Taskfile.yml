version: "3"

tasks:
  default:
    cmds:
      - task: help
  help:
    desc: Show command usage
    silent: true
    cmds:
      - |
        echo "go-query"
        echo ""
        echo "Usage:"
        echo "  task help              Show command usage"
        echo "  task fmt               Format Go source"
        echo "  task lint              Check Go code without modifying it"
        echo "  task test              Run tests with race detection"
        echo "  task test-cover        Run tests with coverage"
        echo "  task build             Compile the library"
        echo "  task hooks             Install local Git hooks"
  fmt:
    desc: Format Go source
    cmds:
      - gofmt -w .
      - golangci-lint fmt
  lint:
    desc: Check Go code without modifying it
    cmds:
      - go vet ./...
      - golangci-lint run --timeout=5m
  test:
    desc: Run tests with race detection
    cmds:
      - go test -race ./... -count=1
  test-cover:
    desc: Run tests with coverage
    cmds:
      - go test -race ./... -coverprofile=coverage.out -count=1
      - go tool cover -func=coverage.out
  build:
    desc: Compile the library
    cmds:
      - go build ./...
  hooks:
    desc: Install local Git hooks
    cmds:
      - git config --local core.hooksPath .githooks
