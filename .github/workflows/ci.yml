name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Keep lint on a toolchain supported by the pinned analyzer.
          go-version: '1.25.x'
          cache: false
      - run: go mod verify
      - name: Check release automation
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          sh .github/scripts/release_test.sh
          sh .github/scripts/release_branch_test.sh
          sh .github/scripts/dependabot_merge_test.sh
      - name: Check module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m
      - name: Check formatting
        run: |
          golangci-lint fmt
          git diff --exit-code

  bubbletea:
    name: Bubble Tea example
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/bubbletea
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: examples/bubbletea/go.sum
      - run: go mod verify
      - name: Check example module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
      - run: go test -race ./... -count=1
      - run: go build -o "$RUNNER_TEMP/cacheq-bubbletea" .

  mcp:
    name: MCP example
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: examples/mcp/go.sum
      - run: go mod verify
      - name: Check example module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
      - run: go test -race ./... -count=1
      - run: go build -o "$RUNNER_TEMP/cacheq-mcp" .
      - run: go run .

  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22.x', stable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Enable Mach-O UUIDs for Go 1.22 on macOS
        if: runner.os == 'macOS' && matrix.go == '1.22.x'
        # New macOS loaders require LC_UUID; Go 1.22 only emits it with -B.
        run: echo 'GOFLAGS=-ldflags=-B=gobuildid' >> "$GITHUB_ENV"
      - name: Run tests
        run: go test -race ./... -count=1 -coverprofile=coverage.out
      - run: go tool cover -func=coverage.out
      - run: go build ./...
